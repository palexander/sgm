id: spec-sgm-validation-focus-001
title: "SGM Validation and Focus"
version: 1
status: active
author: paul

text: |
  `sgm validate` should keep the working tree aligned to the current spec focus:
  1. `sgm validate` validates all active specs against the current repo change set without requiring manual sync.
  2. When a user targets one spec while the working tree still contains unfinished governed changes under a different spec, `sgm` should push back with a focus warning rather than silently encouraging task drift.
  3. That pushback should default to a warning and explain which other spec still has unfinished work.
  4. The user should be able to override that warning explicitly with `--force` on the affected spec-targeted commands.
  5. The focus warning should apply to spec-targeted `context` and `validate` only, not repo-wide validation.
  6. This spec naturally splashes into validation logic, focus-warning rendering, CLI flags, and the tests/docs that exercise scope checking.

