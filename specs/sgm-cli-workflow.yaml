id: spec-sgm-cli-workflow-001
title: "SGM CLI Workflow"
version: 1
status: active
author: paul
warn_below: 0.8

text: |
  Work on SGM should preserve the core agent workflow:
  1. `sgm context <path>` gives the governing spec text before code is changed.
  2. `sgm validate <path>` works from repo-local state without requiring manual sync.
  3. Spec edits are picked up from disk automatically and surfaced as focused `[SPEC-DELTA]` output.
  4. Governance expands through explicit proposals when work reaches ungoverned files.
  5. `sgm sync` is a debug and rebuild tool, not a normal prerequisite for agents.

assertions: []

governs:
  - selector: "src/sgm/**"
    priority: 1
  - selector: "tests/integration/**"
    priority: 1
  - selector: "README.md"
    priority: 2
