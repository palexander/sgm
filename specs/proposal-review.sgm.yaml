id: spec-sgm-proposal-review-001
title: "SGM Interactive Proposal Review"
version: 4
status: active
author: paul

text: |
  SGM should provide a human-friendly interactive review flow for pending proposals:
  1. The review flow surfaces one pending proposal at a time in a stable, deterministic order.
  2. The reviewer can act quickly with simple single-key choices such as approve, reject, or skip.
  3. Skip leaves the proposal pending and moves on to the next item without mutating review state.
  4. Approve and reject record the review decision immediately using the normal durable proposal record path.
  5. Each prompt should include only the essentials needed to decide quickly: proposal id, target spec, proposed path, proposal reason, and the spec text or a concise summary of the spec that owns the proposal.
  6. The review flow should not surface broader related decisions or docs by default because proposals are additive-only splash expansions.
  7. The reviewer should be able to press `g` to expand the prompt and show the target spec's current editable files when they want more context.
  8. In a real interactive terminal, the review flow may clear and redraw from the top of the visible screen between prompts or decisions so each proposal gets an uncluttered full-screen review surface.
  9. Non-interactive and test-oriented runs should keep a plain transcript-friendly fallback instead of depending on screen control behavior.
  10. In that interactive redraw mode, the prompt should show as much of the target spec as fits within the visible terminal height instead of always using a fixed excerpt length.
  11. If the spec text is longer than the available space, the prompt should truncate cleanly with an explicit continuation marker rather than spilling past the intended review surface by default.
  12. The interactive prompt should use intentional blank-line separation between major sections, with extra space before the key hints and action prompt so controls do not visually blend into the spec text.
  13. The flow should stay compact and focused; optional keys like `q` or `?` may be included if they help make the interaction clearer.
  14. This spec naturally splashes into the proposal-review command path, proposal/context rendering, and the docs/tests that explain how humans review pending governance changes.

governs:
  - selector: "specs/proposal-review.sgm.yaml"
    priority: 1
