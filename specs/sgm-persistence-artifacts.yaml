id: spec-sgm-persistence-001
title: "SGM Persistence Artifacts"
version: 1
status: active
author: paul
warn_below: 0.8

text: |
  SGM should persist collaboration state in a Git-friendly way:
  1. Checked-in artifacts are durable, reviewable sources of truth such as specs, decisions, and other per-item governance files.
  2. High-churn runtime state such as caches, indexes, locks, and per-run records stays out of Git in local `.sgm/work/` storage.
  3. Records intended to survive code review move into `.sgm/persisted/` through an explicit persist step rather than being written into durable storage on every run.
  4. Shared history should prefer append-only or file-per-item artifacts over a single mutable state file.
  5. Derived summaries may be cached locally, but they must remain reconstructible from checked-in artifacts plus persisted records.
  6. Multi-user use should avoid commit collisions by separating declarative repo state from operational runtime state.

assertions: []

governs:
  - selector: "README.md"
    priority: 1
  - selector: "src/sgm/adapters/**"
    priority: 2
  - selector: "src/sgm/application/**"
    priority: 2
  - selector: "tests/integration/**"
    priority: 2
