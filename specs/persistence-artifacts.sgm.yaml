id: spec-sgm-persistence-001
title: "SGM Persistence Artifacts"
version: 2
status: active
author: paul

text: |
  SGM should persist collaboration state in a Git-friendly way:
  1. Checked-in artifacts are durable, reviewable sources of truth such as specs, decisions, and other per-item governance files.
  2. High-churn runtime state such as caches, indexes, locks, and per-run records stays out of Git in local `.sgm/work/` storage.
  3. Durable proposal records intended to survive code review are written directly into `.sgm/persisted/proposals/` when proposal state changes, rather than waiting for a later manual handoff.
  4. Standing shared-governance records are also durable state: delegations live in `.sgm/persisted/delegations/`, coordination records live in `.sgm/persisted/coordination/`, and both remain active until explicitly revoked.
  5. Validation runs remain working-state records under `.sgm/work/validations/` and should not be promoted into durable Git-facing storage by default.
  6. Shared history should prefer append-only or file-per-item artifacts over a single mutable state file.
  7. Derived summaries may be cached locally, but they must remain reconstructible from checked-in artifacts plus persisted shared-governance records plus current repo state.
  8. Multi-user use should avoid commit collisions by separating declarative repo state from operational runtime state.
  9. Normal proposal creation and review should not rely on any separate persistence command; proposal state is already durable when it is created, approved, or rejected.
  10. This spec naturally splashes into proposal governance, shared-governance persistence, the repository storage code, and the tests that exercise that state lifecycle.

governs:
  - selector: "specs/persistence-artifacts.sgm.yaml"
    priority: 1
  - selector: "src/sgm/adapters/repository.py"
    priority: 1
  - selector: "src/sgm/domain/core_models.py"
    priority: 1
  - selector: "src/sgm/domain/proposal_models.py"
    priority: 1
