$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SGM Spec Document"
type: object
required:
  - id
  - title
  - status
  - author
  - text
properties:
  id:
    type: string
    minLength: 1
  title:
    type: string
    minLength: 1
  status:
    type: string
    enum:
      - active
      - deprecated
  author:
    type: string
    minLength: 1
  text:
    type: string
    minLength: 1
  governs:
    type: array
    items:
      type: object
      required:
        - selector
      properties:
        selector:
          type: string
          minLength: 1
        priority:
          type: integer
